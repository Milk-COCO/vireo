[package]
name = "vireo"
description = "Vault's rendering engine - or just a genus of bird ~"
keywords = ["vault", "rendering", "graphics", "gui", "gamedev"]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Milk-COCO/vireo"
autoexamples = true

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
cosmic-text = "0.19.0"
glam = { version = "0.33.2", features = ["scalar-math"] }
etagere = "0.3.0"
lru = { version = "0.18.1", default-features = false }
rustc-hash = "2.1.1"
pollster = "1.0.1"
wgpu = "30.0.0"
winit = "0.30.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2" }
