[package]
name = "vireo"
description = "Vault's rendering engine - or just a genus of bird ~"
keywords = ["vault", "rendering", "graphics", "gui", "gamedev"]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Milk-COCO/vireo"
autoexamples = true

[dependencies]
log = "0.4"
env_logger = "0.11"
anyhow = "1"
bytemuck = "1"
cosmic-text = "0.19"
glam = { version = "0.33", features = ["scalar-math"] }
etagere = "0.3"
lru = { version = "0.18", default-features = false }
rustc-hash = "2"
pollster = "1"
vireo_macro = { path = "vireo_macro", version = "0.1" }
wgpu = "30"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.3" }
objc2-core-foundation = { version = "0.3" }

[target.'cfg(target_os = "android")'.dependencies]
# `android-game-activity` 而非 `android-native-activity`：后者没有 InputConnection，
# 只能收软键盘的物理按键事件（仅 ASCII），中文输入不可能。
# GameActivity 提供 GameTextInput（含 `TextInputState`：text / selection /
# compose_region），且 winit 会把 `InputEvent::TextEvent` 投递给我们 —— 之前
# winit 自己把它丢进 `warn!("Unknown android_activity input event")`，现在
# vireo 直接从 `AndroidApp::text_input_state(false)` 取，不再依赖 winit 转发。
# 代价：activity 基类换成 `com.google.androidgamesdk.GameActivity`（AppCompatActivity
# 子类），构建链必须走 gradle + `androidx.games:games-activity:4.4.0`，
# `xbuild`/`cargo-apk` 不再适用（详见 `.opencode/android_design_review.md` §7.4）。
winit = { version = "0.30", features = ["android-game-activity"] }
# 直接依赖只为拿到 `input::{InputType, TextInputAction, ImeOptions, TextSpan}`
# —— 这些类型是 `set_ime_purpose` / 回填光标位置的入参，winit 不 re-export。
# 与 winit 拉进来的同一个 0.6 系列，cargo 会统一成一份（版本不一致会编译失败，
# 属于安全的响亮失败，不会静默产生两份 AndroidApp 类型）。
android-activity = { version = "0.6", features = ["game-activity"] }
android_logger = "0.13"
# 与 android-activity 0.6（winit 的 android-game-activity 后端）同版本，
# 避免同一进程内出现两份 jni。vireo 只经 `vm_as_ptr` / `activity_as_ptr`
# 拿裸指针自行建 JavaVM，不跨 crate 传 jni 类型。
jni = "0.22.4"
