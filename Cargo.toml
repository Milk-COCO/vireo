[package]
name = "vireo"
description = "Vault's rendering engine - or just a genus of bird ~"
keywords = ["vault", "rendering", "graphics", "gui", "gamedev"]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Milk-COCO/vireo"
autoexamples = true

[dependencies]
anyhow = "1.0.103"
bytemuck = "1.25.1"
cosmic-text = "0.19.0"
glam = { version = "0.33.2", features = ["scalar-math"] }
etagere = "0.3.0"
lru = { version = "0.16.2", default-features = false }
rustc-hash = "2.1.1"
pollster = "1.0.1"
wgpu = "30.0.0"
winit = "0.30.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
