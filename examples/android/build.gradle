// vireo 的 Android 构建工程。
//
// ⚠️ 为什么不用 `xbuild` / `cargo-apk`：那套 apk 工具链假设宿主是 `NativeActivity`，
//   而 vireo 为了**中文输入法**必须用 `AGDK GameActivity`（`NativeActivity` 没有
//   `InputConnection`，拿不到 IME）。`GameActivity extends AppCompatActivity`，
//   于是**必须**有 gradle + 两个 AAR 依赖 —— 纯 Cargo 的 apk 工具做不到。
//
// 权威参考：https://github.com/rust-mobile/rust-android-examples/tree/main/agdk-winit-wgpu

plugins {
    id 'com.android.application'
}

// ---- Rust cdylib 打包 --------------------------------------------------
// 三者必须一致：
//   Cargo.toml 的 [lib] name  =  <rustCrate>
//   这里生成的产物 lib<rustCrate>.so
//   MainActivity.java 的 System.loadLibrary("<rustCrate>")
def rustCrate = 'vireoandroid'

// ABI -> Rust target triple。要加 ABI 就往这里加一行，别的地方会自动跟上。
//
// ⚠️ **至少要两个 ABI**，否则一半的测试设备装不上：
//
// | ABI | 跑在哪 |
// |---|---|
// | `arm64-v8a` | 真机、ARM 云手机 |
// | `x86_64`    | **Windows Subsystem for Android**（WSA 跑在 x86_64 主机上时原生就是这个）|
//
// 只发 arm64 的 APK 在 x86_64 的 WSA 上 `adb install` 直接
// `INSTALL_FAILED_NO_MATCHING_ABIS` —— 系统按 ABI 过滤，跟 WSA 能不能跑无关。
// 除非装了微软的「Android Subsystem for ARM64」翻译包，但那是按 CPU 型号挑的，
// 别指望。
def rustAbis = [
    'arm64-v8a': 'aarch64-linux-android',
    'x86_64'   : 'x86_64-linux-android',
]

// ---- NDK 选择--------------------------------------------------------------
// 优先级：`-PndkVersion=` > 环境变量 > `local.properties` 的 ndk.dir。
//
// ⚠️ **为什么要给这个开关**：**不是为了 16 KB**。16 KB 由 `.cargo/config.toml` 里
// 显式传的 `-Wl,-z,max-page-size=16384` **和 `-Wl,-z,common-page-size=16384`** 解决
// （cargo-ndk 不会注入后者；缺了它 NDK r28 编出的 `PT_GNU_RELRO` 末尾按 4 KB 对齐，
// 实测 `mod 0x1000` 不合规，见 README §5 + `check-16kb.ps1`）。这个开关是为了
// **可复现**：不设 `ANDROID_NDK_HOME` / `NDK_HOME` / `local.properties` 时，
// `cargo-ndk` 会**自动挑 SDK 里版本号最高的 NDK** —— 换台机器、SDK 装了个新的，
// 同一份代码就编出不同的二进制。显式锁定才可复现：
//
//     ./gradlew assembleRelease -PndkVersion=28.2.13676358
//
// ⚠️ **PowerShell 里要加引号**：`& .\gradlew.bat assembleRelease -PndkVersion=28.2.13676358`
// 会被 cmd 在 `=` 后的首个 `.` 处把参数截断（实测拆成 `-PndkVersion=28` +
// 任务名 `.2.13676358`）。写成 `'-PndkVersion=28.2.13676358'` 才完整。
//
// ⚠️ **不能用 `project.findProperty('ndkVersion')`**：AGP 会往 project 上注入一个
// 同名的约定属性（AGP 9.1 默认 NDK 恰好就是 `28`），`findProperty` 读到的是它，
// `-PndkVersion=` 反而被无视 → 去找不存在的 `sdk/ndk/28`。
// `gradle.startParameter.projectProperties` 只含命令行 `-P` 传进来的键，干净。
def ndkVersion = gradle.startParameter.projectProperties['ndkVersion']

def localProps = new Properties()
def lpFile = file('local.properties')
if (lpFile.exists()) {
    lpFile.withInputStream { localProps.load(it) }
}

def ndkHome = null
if (ndkVersion) {
    def base = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (!base) {
        throw new GradleException(
            "传了 -PndkVersion=${ndkVersion} 但没有 ANDROID_HOME / ANDROID_SDK_ROOT 环境变量，\n" +
            "无法定位 SDK 目录。也可以直接 export ANDROID_NDK_HOME 指向具体 NDK。")
    }
    ndkHome = file("${base}/ndk/${ndkVersion}").absolutePath
    if (!file(ndkHome).exists()) {
        throw new GradleException(
            "找不到 NDK: ${ndkHome}\n" +
            "装它：sdkmanager \"ndk;${ndkVersion}\"")
    }
    logger.lifecycle("NDK (来自 -PndkVersion): ${ndkHome}")
} else {
    ndkHome = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('NDK_HOME') ?: localProps.getProperty('ndk.dir')
    if (ndkHome) {
        logger.lifecycle("NDK (来自环境/local.properties): ${ndkHome}")
    } else {
        logger.lifecycle("NDK: 未指定 —— cargo-ndk 会自动取SDK 里版本号最高的那个（不同机器结果可能不同）。建议 -PndkVersion=<ver> 锁定。")
    }
}

rustAbis.each { abi, triple ->
    tasks.register("cargoNdkBuild-${abi}", Exec) {
        group = 'build'
        description = "cargo ndk -t ${abi} build --release --lib（产出 lib${rustCrate}.so）"
        workingDir projectDir
        // 必须是 `--lib`：Android 只要 cdylib，`src/lib.rs` 是 lib target，
        // 缺 `--lib` 会连带编译桌面 bin target 而交叉链接失败。
        commandLine 'cargo', 'ndk', '-t', abi, 'build', '--release', '--lib'
        if (ndkHome != null) {
            environment 'ANDROID_NDK_HOME', ndkHome
            environment 'NDK_HOME', ndkHome
        }
    }
}

tasks.register('copyRustLibs') {
    group = 'build'
    description = "把 lib${rustCrate}.so 拷进各 ABI 的 jniLibs/"
    // 注意 `keySet()`：Groovy 里 `Map.collect { }` 迭代的是 **value**（这里是 triple），
    // 直接 `rustAbis.collect` 会拼出 `cargoNdkBuild-aarch64-linux-android` 这种
    // 不存在的任务名，表现为「构建时找不到依赖的任务」这种难懂的报错。
    dependsOn rustAbis.keySet().collect { abi -> "cargoNdkBuild-${abi}" }
    // 只拷构建过的那些 ABI。jniLibs 下多余的 .so 会被打进 APK，
    // 体积翻倍且某些机型会挑错库。
    doLast {
        rustAbis.each { abi, triple ->
            def src = file("$projectDir/target/${triple}/release/lib${rustCrate}.so")
            if (!src.exists()) {
                throw new GradleException(
                    "cargo 没产出 ${src}。先自己跑一遍 " +
                    "`cargo ndk -t ${abi} build --release --lib` 看报错。")
            }
            def dstDir = file("$projectDir/src/main/jniLibs/${abi}")
            dstDir.mkdirs()
            copy { from src; into dstDir }
            logger.lifecycle("lib${rustCrate}.so -> jniLibs/${abi} " +
                             "(${(src.length() / 1024.0).round()} KB)")
        }
    }
}

tasks.named('preBuild') { dependsOn 'copyRustLibs' }

android {
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.example.vireoandroid'

        // GameActivity 4.4.0 要 minSdk 31，别降。
        minSdk = 31

        // ⚠️ targetSdk 35 不是可选项：
        //   `windowLayoutInDisplayCutoutMode`（挖孔/刘海）在 targetSdk < 35 时
        //   被系统忽略，内容被 letterbox 到安全区里。真机验证过：
        //   旧配置 2264×1080 letterbox，新配置 2392×1080 满宽。
        targetSdk = 35

        versionCode = 1
        versionName = '0.1.0'

        ndk {
            // 只列实际构建的 ABI。多列但没构建 → APK 里那个目录是空的，
            // 某些机型会因此挑错库。
            abiFilters(*rustAbis.keySet().toList())
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            // 保留 Rust 符号：logcat / native backtrace 才能定位到 Rust 帧
            debuggable true
        }
        release {
            // ⚠️ 开 minify 前先读 platform/android.rs 顶部关于 R8 的警告：
            // android-activity 的 GameActivity 依赖走反射，混淆会让 JNI 入口找不到类。
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    namespace = 'com.example.vireoandroid'

    // ---- 16 KB page size（Android 15+ 强制）--------------------------------
    // `useLegacyPackaging = false` ⇒ extractNativeLibs=false ⇒ .so 以 STORED 方式
    // 打进 APK，由 APK zip 对齐到 16 KB。这是**必要条件**，不是优化。
    //
    // ⚠️ 但它**不充分**：真正的 16 KB 对齐要求 **NDK r28+**（r28 起默认
    // `-z max-page-size=16384`）。本模板验证时用的是 NDK 26.3，**16 KB 未保证**。
    // 上架 Google Play（2025-11 起）前请把 NDK 升到 r28+ 并实测：
    //   adb shell getconf PAGE_SIZE   # 设备侧
    //   zipalign -c -P 16 -v 4 app-release.apk
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // GameActivity 继承 AppCompatActivity，**必须有** appcompat，
    // 用非 AppCompat 主题会在运行时崩（找不到 AppCompat 定义的 attr）。
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // GameActivity 本体（含 game-text-input，提供 InputConnection）。
    implementation 'androidx.games:games-activity:4.4.0'
}